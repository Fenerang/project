<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Demo Notes App</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="wrap">
    <h1>Demo Notes</h1>
    <p class="hint">Тестовое веб-приложение для демонстрации бэкапов</p>
    <form id="note-form">
      <input name="title" placeholder="Заголовок" required>
      <textarea name="content" placeholder="Текст заметки"></textarea>
      <button type="submit">Добавить</button>
    </form>
    <ul id="notes"></ul>
  </div>
  <script>
    async function load() {
      const res = await fetch('/api/notes');
      const notes = await res.json();
      document.getElementById('notes').innerHTML = notes.map(n =>
        `<li><strong>${n.title}</strong><p>${n.content || ''}</p><small>${n.created_at}</small></li>`
      ).join('');
    }
    document.getElementById('note-form').onsubmit = async (e) => {
      e.preventDefault();
      await fetch('/api/notes', { method: 'POST', body: new FormData(e.target) });
      e.target.reset();
      load();
    };
    load();
  </script>
</body>
</html>
